<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Desempeño · Apprecio</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #FA345E;
    --purple: #8B85D4;
    --purple-light: #f0eef8;
    --green: #1a8a45;
    --green-light: #e6f9ee;
    --yellow: #b07a00;
    --yellow-light: #fff8e6;
    --dark: #1a1a1a;
    --gray: #f7f6f8;
    --border: #e2e0e8;
    --subtle: #999;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Montserrat', sans-serif; background: var(--gray); min-height: 100vh; color: var(--dark); }

  .header { background: var(--red); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; position: relative; overflow: hidden; }
  .header-orn { position: absolute; right: 0; top: 0; pointer-events: none; }
  .header-left { position: relative; z-index: 1; }
  .header-label { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.7); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .header-title { font-size: 18px; font-weight: 700; color: white; }
  .header-right { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; }
  .lider-select { font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600; color: var(--red); background: white; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; min-width: 200px; }
  .periodo-select { font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; color: var(--red); background: white; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; }

  .loading-screen { display: flex; align-items: center; justify-content: center; min-height: 60vh; flex-direction: column; gap: 16px; }
  .loading-screen p { font-size: 13px; color: var(--subtle); }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

  .metrics-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .metric-card { background: white; border-radius: 12px; border: 0.5px solid var(--border); padding: 16px 18px; }
  .metric-label { font-size: 10px; font-weight: 600; color: var(--subtle); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; }
  .metric-val { font-size: 32px; font-weight: 700; line-height: 1; }
  .metric-sub { font-size: 11px; color: var(--subtle); margin-top: 6px; }
  .mv-red { color: var(--red); }
  .mv-purple { color: var(--purple); }
  .mv-green { color: var(--green); }
  .mv-yellow { color: var(--yellow); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .full-col { margin-bottom: 16px; }
  .card { background: white; border-radius: 12px; border: 0.5px solid var(--border); padding: 18px 20px; }
  .card-title { font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
  .card-tag { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: var(--purple-light); color: var(--purple); }

  .pilar-row { margin-bottom: 14px; }
  .pilar-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .pilar-name { font-size: 12px; font-weight: 600; color: var(--dark); }
  .pilar-counts { font-size: 11px; color: var(--subtle); }
  .pilar-bar { height: 10px; border-radius: 5px; background: var(--gray); overflow: hidden; display: flex; }
  .bar-f { background: var(--green); border-radius: 5px 0 0 5px; }
  .bar-o { background: var(--red); border-radius: 0 5px 5px 0; }
  .bar-legend { display: flex; gap: 14px; margin-top: 10px; }
  .bar-legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--subtle); }
  .bar-legend-dot { width: 8px; height: 8px; border-radius: 2px; }

  .colab-table { width: 100%; border-collapse: collapse; }
  .colab-table th { padding: 8px 10px; text-align: left; font-size: 9px; font-weight: 700; color: var(--subtle); text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 0.5px solid var(--border); background: var(--gray); }
  .colab-table td { padding: 10px; border-bottom: 0.5px solid #f5f5f5; font-size: 12px; color: var(--dark); }
  .colab-table tr:last-child td { border-bottom: none; }
  .colab-table tr { cursor: pointer; }
  .colab-table tr:hover td { background: #fdf6f8; }

  .checkin-dots { display: flex; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-ok { background: var(--green); }
  .dot-empty { background: var(--border); }

  .badge-sm { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
  .b-green { background: var(--green-light); color: var(--green); }
  .b-red { background: #fff0f3; color: var(--red); }
  .b-yellow { background: var(--yellow-light); color: var(--yellow); }
  .b-purple { background: var(--purple-light); color: var(--purple); }

  .ac-table { width: 100%; border-collapse: collapse; }
  .ac-table th { padding: 8px 10px; text-align: left; font-size: 9px; font-weight: 700; color: var(--subtle); text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 0.5px solid var(--border); background: var(--gray); }
  .ac-table td { padding: 10px; border-bottom: 0.5px solid #f5f5f5; font-size: 12px; }
  .ac-table tr:last-child td { border-bottom: none; }

  .empty { text-align: center; padding: 24px; font-size: 12px; color: var(--subtle); font-style: italic; }

  .detail-back { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--red); background: none; border: none; cursor: pointer; font-family: 'Montserrat', sans-serif; margin-bottom: 16px; padding: 0; }

  .detail-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .detail-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: white; flex-shrink: 0; }
  .detail-name { font-size: 16px; font-weight: 700; color: var(--dark); }
  .detail-sub { font-size: 12px; color: var(--subtle); margin-top: 2px; }

  .timeline { }
  .timeline-item { display: flex; gap: 14px; margin-bottom: 16px; }
  .tl-left { display: flex; flex-direction: column; align-items: center; }
  .tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); flex-shrink: 0; margin-top: 3px; }
  .tl-line { width: 1px; background: var(--border); flex: 1; margin-top: 4px; }
  .tl-content { flex: 1; padding-bottom: 4px; }
  .tl-mes { font-size: 11px; font-weight: 700; color: var(--red); margin-bottom: 4px; }
  .tl-foco { font-size: 11px; color: var(--dark); margin-bottom: 3px; }
  .tl-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .tl-tag { font-size: 9px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
  .tt-f { background: var(--green-light); color: var(--green); }
  .tt-o { background: #fff0f3; color: var(--red); }
  .tt-a { background: var(--purple-light); color: var(--purple); }

  @media (max-width: 768px) {
    .metrics-row { grid-template-columns: 1fr 1fr; }
    .two-col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-orn">
    <svg width="120" height="80" viewBox="0 0 120 80" fill="none">
      <rect x="80" width="40" height="40" fill="rgba(255,255,255,0.10)"/>
      <rect x="40" width="40" height="40" fill="rgba(255,255,255,0.06)"/>
      <rect x="80" y="40" width="40" height="40" fill="rgba(255,255,255,0.14)"/>
      <rect x="40" y="40" width="40" height="40" fill="rgba(255,255,255,0.08)"/>
    </svg>
  </div>
  <div class="header-left">
    <div class="header-label">Feedback Continuo Apprecio</div>
    <div class="header-title">Dashboard de Desempeño</div>
  </div>
  <div class="header-right">
    <select class="lider-select" id="lider-select" onchange="cargarDashboard()">
      <option value="">Cargando líderes...</option>
    </select>
  </div>
</div>

<div class="main" id="main">
  <div class="loading-screen" id="loading">
    <div class="spinner"></div>
    <p>Cargando dashboard...</p>
  </div>
  <div id="dashboard-content" style="display:none;"></div>
  <div id="detail-content" style="display:none;"></div>
</div>

<script>
const WEBHOOK_LIDERES = 'https://n8n.openip.cl/webhook/get-lideres';
const WEBHOOK_DASHBOARD = 'https://n8n.openip.cl/webhook/get-dashboard';

let dashboardData = null;
let liderActual = null;

async function init() {
  try {
    const res = await fetch(WEBHOOK_LIDERES);
    const data = await res.json();
    const sel = document.getElementById('lider-select');
    sel.innerHTML = '<option value="">— Selecciona tu nombre —</option>';
    (data.lideres || []).forEach(l => {
      const opt = document.createElement('option');
      opt.value = l.rut;
      opt.textContent = l.nombre;
      sel.appendChild(opt);
    });
    document.getElementById('loading').style.display = 'none';
  } catch(e) {
    document.getElementById('loading').innerHTML = '<p>Error al cargar. Intenta recargar la página.</p>';
  }
}

async function cargarDashboard() {
  const rut = document.getElementById('lider-select').value;
  if (!rut) { document.getElementById('dashboard-content').style.display = 'none'; return; }

  liderActual = rut;
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('dashboard-content').style.display = 'none';
  document.getElementById('detail-content').style.display = 'none';

  try {
    const url = rut ? `${WEBHOOK_DASHBOARD}?rut_lider=${rut}` : WEBHOOK_DASHBOARD;
    const res = await fetch(url);
    dashboardData = await res.json();
    renderDashboard(dashboardData);
  } catch(e) {
    document.getElementById('loading').innerHTML = '<p>Error al cargar los datos.</p>';
  }
}

function renderDashboard(data) {
  const m = data.metricas;
  const colabs = data.colaboradores || [];
  const pilares = data.pilares || {};
  const acActivos = data.accionables_activos_lista || [];

  const totalF = m.fortalezas || 0;
  const totalO = m.oportunidades || 0;
  const totalPilares = totalF + totalO;

  function barWidth(val) {
    return totalPilares > 0 ? Math.round((val / totalPilares) * 100) : 0;
  }

  function pilarBar(pilar, nombre, icono) {
    const p = pilares[pilar] || { fortalezas: 0, oportunidades: 0 };
    const total = p.fortalezas + p.oportunidades;
    const wF = total > 0 ? Math.round((p.fortalezas / total) * 100) : 0;
    const wO = total > 0 ? Math.round((p.oportunidades / total) * 100) : 0;
    return `<div class="pilar-row">
      <div class="pilar-label">
        <span class="pilar-name">${icono} ${nombre}</span>
        <span class="pilar-counts">${p.fortalezas}F · ${p.oportunidades}O</span>
      </div>
      <div class="pilar-bar">
        <div class="bar-f" style="width:${wF}%"></div>
        <div class="bar-o" style="width:${wO}%"></div>
      </div>
    </div>`;
  }

  function colabRow(c) {
    const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const dots = meses.map(m => {
      const tiene = (c.meses || []).some(mes => mes.toLowerCase().includes(m.toLowerCase().substring(0,3)));
      return `<div class="dot ${tiene ? 'dot-ok' : 'dot-empty'}" title="${m}"></div>`;
    }).join('');

    const initials = c.nombre.split(' ').slice(0,2).map(n => n[0]).join('');
    return `<tr onclick="verDetalle('${c.rut}')">
      <td><div style="display:flex;align-items:center;gap:10px;">
        <div style="width:30px;height:30px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;flex-shrink:0;">${initials}</div>
        <div><div style="font-weight:600;">${c.nombre}</div><div style="font-size:10px;color:var(--subtle);">${c.lider}</div></div>
      </div></td>
      <td><div class="checkin-dots">${dots}</div></td>
      <td>${c.checkins || 0}</td>
      <td>${c.accionables_activos || 0}</td>
      <td>${c.accionables_cumplidos || 0}</td>
    </tr>`;
  }

  function acRow(ac) {
    const fecha = ac.Fecha_comprometida ? ac.Fecha_comprometida.split('-').reverse().join('-') : '—';
    const hoy = new Date();
    const vence = new Date(ac.Fecha_comprometida);
    const diff = Math.ceil((vence - hoy) / (1000 * 60 * 60 * 24));
    let badge = `<span class="badge-sm b-yellow">En proceso</span>`;
    if (diff <= 3 && diff >= 0) badge = `<span class="badge-sm b-red">Vence en ${diff}d</span>`;
    else if (diff < 0) badge = `<span class="badge-sm b-red">Vencido</span>`;

    return `<tr>
      <td>${ac.Descripcion}</td>
      <td>${ac.Owner_nombre_display || ac.Owner_nombre || '—'}</td>
      <td>${ac.Nombre_display_colaborador || ac.Nombre_colaborador || '—'}</td>
      <td>${fecha}</td>
      <td>${badge}</td>
    </tr>`;
  }

  const html = `
    <div class="metrics-row">
      <div class="metric-card">
        <div class="metric-label">Check-ins completados</div>
        <div class="metric-val mv-red">${m.total_checkins}</div>
        <div class="metric-sub">${colabs.length} colaborador${colabs.length !== 1 ? 'es' : ''}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Accionables activos</div>
        <div class="metric-val mv-purple">${m.accionables_activos}</div>
        <div class="metric-sub">${m.accionables_cumplidos} cumplidos</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Fortalezas registradas</div>
        <div class="metric-val mv-green">${m.fortalezas}</div>
        <div class="metric-sub">en 3 pilares</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Oportunidades de mejora</div>
        <div class="metric-val mv-yellow">${m.oportunidades}</div>
        <div class="metric-sub">en 3 pilares</div>
      </div>
    </div>

    <div class="two-col">
      <div class="card">
        <div class="card-title">Equipo <span class="card-tag">clic para ver detalle</span></div>
        ${colabs.length === 0 ? '<div class="empty">No hay check-ins registrados aún.</div>' : `
        <table class="colab-table">
          <thead><tr>
            <th>Colaborador</th>
            <th>Check-ins 2026</th>
            <th>Total</th>
            <th>Activos</th>
            <th>Cumplidos</th>
          </tr></thead>
          <tbody>${colabs.map(colabRow).join('')}</tbody>
        </table>`}
      </div>
      <div class="card">
        <div class="card-title">Pilares — distribución acumulada</div>
        ${pilarBar('accountability', 'Accountability', '🎯')}
        ${pilarBar('productividad', 'Productividad', '⚡')}
        ${pilarBar('customer_centricity', 'Customer Centricity', '🌟')}
        <div class="bar-legend">
          <div class="bar-legend-item"><div class="bar-legend-dot" style="background:var(--green);"></div>Fortaleza</div>
          <div class="bar-legend-item"><div class="bar-legend-dot" style="background:var(--red);"></div>Oportunidad</div>
        </div>
      </div>
    </div>

    <div class="full-col card">
      <div class="card-title">Accionables activos del equipo</div>
      ${acActivos.length === 0 ? '<div class="empty">No hay accionables activos.</div>' : `
      <table class="ac-table">
        <thead><tr>
          <th>Accionable</th><th>Owner</th><th>Colaborador</th><th>Fecha</th><th>Estado</th>
        </tr></thead>
        <tbody>${acActivos.map(acRow).join('')}</tbody>
      </table>`}
    </div>
  `;

  document.getElementById('loading').style.display = 'none';
  document.getElementById('dashboard-content').innerHTML = html;
  document.getElementById('dashboard-content').style.display = 'block';
}

function verDetalle(rut) {
  if (!dashboardData) return;
  const colab = dashboardData.colaboradores.find(c => c.rut === rut);
  if (!colab) return;

  const pilaresPorColab = dashboardData.pilares_por_colab || {};
  const p = pilaresPorColab[rut] || { accountability:{f:0,o:0}, productividad:{f:0,o:0}, customer_centricity:{f:0,o:0} };
  const acColab = (dashboardData.accionables_activos_lista || []).filter(a => a.RUT_colaborador === rut);
  const initials = colab.nombre.split(' ').slice(0,2).map(n => n[0]).join('');

  function pilarDetalle(pilar, nombre, icono) {
    const datos = p[pilar] || {f:0, o:0};
    const total = datos.f + datos.o;
    const wF = total > 0 ? Math.round((datos.f / total) * 100) : 0;
    const wO = total > 0 ? Math.round((datos.o / total) * 100) : 0;
    return `<div class="pilar-row">
      <div class="pilar-label">
        <span class="pilar-name">${icono} ${nombre}</span>
        <span class="pilar-counts">${datos.f}F · ${datos.o}O</span>
      </div>
      <div class="pilar-bar">
        <div class="bar-f" style="width:${wF}%"></div>
        <div class="bar-o" style="width:${wO}%"></div>
      </div>
    </div>`;
  }

  const timelineHTML = (colab.meses || []).map(mes => `
    <div class="timeline-item">
      <div class="tl-left"><div class="tl-dot"></div><div class="tl-line"></div></div>
      <div class="tl-content">
        <div class="tl-mes">${mes}</div>
        <div class="tl-foco">Check-in completado</div>
        <div class="tl-tags">
          ${p.accountability.f > 0 ? '<span class="tl-tag tt-f">Accountability: fortaleza</span>' : ''}
          ${p.productividad.o > 0 ? '<span class="tl-tag tt-o">Productividad: oportunidad</span>' : ''}
          ${acColab.length > 0 ? `<span class="tl-tag tt-a">${acColab.length} accionable${acColab.length > 1 ? 's' : ''}</span>` : ''}
        </div>
      </div>
    </div>`).join('');

  const html = `
    <button class="detail-back" onclick="volverDashboard()">← Volver al equipo</button>
    <div class="detail-header">
      <div class="detail-avatar">${initials}</div>
      <div>
        <div class="detail-name">${colab.nombre}</div>
        <div class="detail-sub">Líder: ${colab.lider} · ${colab.checkins} check-in${colab.checkins !== 1 ? 's' : ''} registrado${colab.checkins !== 1 ? 's' : ''}</div>
      </div>
    </div>

    <div class="metrics-row">
      <div class="metric-card"><div class="metric-label">Check-ins</div><div class="metric-val mv-red">${colab.checkins || 0}</div></div>
      <div class="metric-card"><div class="metric-label">Accionables activos</div><div class="metric-val mv-purple">${colab.accionables_activos || 0}</div></div>
      <div class="metric-card"><div class="metric-label">Fortalezas</div><div class="metric-val mv-green">${p.accountability.f + p.productividad.f + p.customer_centricity.f}</div></div>
      <div class="metric-card"><div class="metric-label">Oportunidades</div><div class="metric-val mv-yellow">${p.accountability.o + p.productividad.o + p.customer_centricity.o}</div></div>
    </div>

    <div class="two-col">
      <div class="card">
        <div class="card-title">Historial de check-ins</div>
        ${colab.meses?.length > 0 ? `<div class="timeline">${timelineHTML}</div>` : '<div class="empty">Sin check-ins registrados.</div>'}
      </div>
      <div class="card">
        <div class="card-title">Mapa conductual acumulado</div>
        ${pilarDetalle('accountability', 'Accountability', '🎯')}
        ${pilarDetalle('productividad', 'Productividad', '⚡')}
        ${pilarDetalle('customer_centricity', 'Customer Centricity', '🌟')}
        <div class="bar-legend">
          <div class="bar-legend-item"><div class="bar-legend-dot" style="background:var(--green);"></div>Fortaleza</div>
          <div class="bar-legend-item"><div class="bar-legend-dot" style="background:var(--red);"></div>Oportunidad</div>
        </div>
      </div>
    </div>

    ${acColab.length > 0 ? `
    <div class="full-col card">
      <div class="card-title">Accionables activos</div>
      <table class="ac-table">
        <thead><tr><th>Accionable</th><th>Owner</th><th>Fecha</th><th>Estado</th></tr></thead>
        <tbody>${acColab.map(ac => {
          const fecha = ac.Fecha_comprometida ? ac.Fecha_comprometida.split('-').reverse().join('-') : '—';
          return `<tr><td>${ac.Descripcion}</td><td>${ac.Owner_nombre_display || ac.Owner_nombre}</td><td>${fecha}</td><td><span class="badge-sm b-yellow">En proceso</span></td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>` : ''}
  `;

  document.getElementById('dashboard-content').style.display = 'none';
  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail-content').style.display = 'block';
}

function volverDashboard() {
  document.getElementById('detail-content').style.display = 'none';
  document.getElementById('dashboard-content').style.display = 'block';
}

init();
</script>
</body>
</html>
