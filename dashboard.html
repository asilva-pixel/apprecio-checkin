<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>People Analytics Pro - 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8F9FA;
      --card: #FFFFFF;
      --red: #E30613;
      --text: #1D1D1B;
      --subtle: #707070;
      --border: #E0E0E0;
      --gray: #F2F2F2;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }

    /* Header & Selects */
    .header { background: var(--card); padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; }
    .header-select { border: none; font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 700; color: var(--red); cursor: pointer; outline: none; background: transparent; }

    /* Layout */
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
    .grid-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
    
    /* Stats */
    .stat-val { font-size: 24px; font-weight: 700; color: var(--red); }
    .stat-label { font-size: 11px; color: var(--subtle); text-transform: uppercase; font-weight: 600; margin-top: 4px; }

    /* Nine Box Unificado */
    .nb-wrapper { display: flex; gap: 10px; margin-top: 15px; }
    .nb-axis-y-container { display: flex; gap: 8px; }
    .nb-y-title { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; font-weight: 700; color: var(--subtle); text-align: center; }
    .nb-y-labels { display: flex; flex-direction: column; justify-content: space-around; font-size: 9px; color: var(--subtle); font-weight: 600; }
    
    .nb-grid-main { flex: 1; }
    .nb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--border); border: 4px solid var(--border); border-radius: 4px; aspect-ratio: 1.2 / 1; }
    .nb-cell { background: white; padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .nb-cell-label { font-size: 7px; text-align: center; color: var(--subtle); font-weight: 600; margin-bottom: 2px; }
    .nb-cell-val { font-size: 14px; font-weight: 700; color: var(--text); }
    
    .nb-x-labels { display: flex; justify-content: space-around; margin-top: 6px; font-size: 9px; color: var(--subtle); font-weight: 600; }
    .nb-x-title { text-align: center; font-size: 10px; font-weight: 700; color: var(--subtle); margin-top: 4px; text-transform: uppercase; }

    /* Table */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; font-size: 10px; color: var(--subtle); text-transform: uppercase; padding: 10px; border-bottom: 1px solid var(--border); }
    td { padding: 12px 10px; font-size: 13px; border-bottom: 1px solid var(--border); }
    .btn-ver { color: var(--red); font-weight: 700; cursor: pointer; border: none; background: none; font-family: 'Montserrat'; }

    /* Timeline Detalle Individual */
    .timeline { margin-top: 20px; }
    .timeline-item { display: flex; gap: 15px; margin-bottom: 0; }
    .tl-left { display: flex; flex-direction: column; align-items: center; width: 20px; }
    .tl-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--border); z-index: 2; }
    .tl-line { width: 2px; flex: 1; background: var(--border); margin: 4px 0; }
    .tl-content { padding-bottom: 25px; flex: 1; }
    .tl-mes { font-weight: 700; font-size: 14px; }
    .tl-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-top: 5px; background: var(--gray); color: var(--subtle); }
    .tt-f { background: #E3061320; color: var(--red); }

    /* Nav */
    .nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid var(--border); padding: 10px 0; }
    .nav-item { flex: 1; text-align: center; font-size: 10px; font-weight: 700; color: var(--subtle); cursor: pointer; }
    .nav-item.active { color: var(--red); }
    
    #loading { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); display:none; justify-content:center; align-items:center; z-index:1000; font-weight:700; }
  </style>
</head>
<body>

  <div id="loading">CARGANDO...</div>

  <div id="view-global">
    <div class="header">
      <div id="selector-periodo-global"></div>
      <select id="selector-area-global" class="header-select" onchange="cambiarArea(this.value)">
        <option value="TODAS">TODAS LAS ÁREAS</option>
      </select>
    </div>
    <div class="container" id="global-content"></div>
  </div>

  <div id="view-equipo" style="display:none;">
    <div class="header">
        <span style="font-weight: 700; color: var(--red);">MI EQUIPO</span>
    </div>
    <div class="container" id="equipo-content"></div>
  </div>

  <div id="view-detalle" style="display:none;">
    <div class="header">
      <button onclick="irAEquipo()" style="border:none; background:none; font-weight:700; cursor:pointer;">← VOLVER</button>
      <span id="detalle-nombre" style="font-weight:700; color:var(--red);"></span>
    </div>
    <div class="container" id="detail-content"></div>
  </div>

  <nav class="nav">
    <div class="nav-item active" onclick="showTab('global')">GLOBAL</div>
    <div class="nav-item" onclick="showTab('equipo')">MI EQUIPO</div>
  </nav>

  <script>
    // CONFIGURACIÓN
    const WEBHOOK_DASHBOARD = "https://script.google.com/macros/s/AKfycbyC0qO6Y_Y1G67rL4hA6D_fV8jE-72a39-Y0MIdL3oE5mX65_H3EaY8mH63M2B3-78/exec"; // Reemplazar con el tuyo
    const WEBHOOK_GLOBAL = "https://script.google.com/macros/s/AKfycbzL5n82L6N2z_A9Y7_E58J9M3N2_6L_Y8M32B3M2B-Y2M3/exec"; // Reemplazar con el tuyo
    
    const MESES_ORDEN = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    
    let globalData = null;
    let dashboardData = null;
    let mesGlobalActivo = "Acumulado";
    let areaActiva = "TODAS";

    async function cargarGlobal(mes = "Acumulado") {
      mesGlobalActivo = mes;
      document.getElementById('loading').style.display = 'flex';
      try {
        const resp = await fetch(`${WEBHOOK_GLOBAL}?mes=${encodeURIComponent(mes)}`);
        globalData = await resp.json();
        renderGlobal();
      } catch (e) { console.error(e); }
      document.getElementById('loading').style.display = 'none';
    }

    async function cargarEquipo() {
      document.getElementById('loading').style.display = 'flex';
      try {
        const resp = await fetch(WEBHOOK_DASHBOARD);
        dashboardData = await resp.json();
        renderEquipo();
      } catch (e) { console.error(e); }
      document.getElementById('loading').style.display = 'none';
    }

    function renderGlobal() {
      const container = document.getElementById('global-content');
      const d = areaActiva === "TODAS" ? globalData.totales : globalData.por_area[areaActiva];
      
      // Actualizar Selector Período
      const mesesSelect = MESES_ORDEN.map(m => `${m} 2026`);
      document.getElementById('selector-periodo-global').innerHTML = `
        <select class="header-select" onchange="cargarGlobal(this.value)">
          <option value="Acumulado" ${mesGlobalActivo === 'Acumulado' ? 'selected' : ''}>ACUMULADO 2026</option>
          ${mesesSelect.map(m => `<option value="${m}" ${mesGlobalActivo === m ? 'selected' : ''}>${m.toUpperCase()}</option>`).join('')}
        </select>
      `;

      // Actualizar Selector Áreas si es la primera carga
      const selArea = document.getElementById('selector-area-global');
      if(selArea.options.length <= 1) {
        Object.keys(globalData.por_area).forEach(a => {
            const opt = document.createElement('option');
            opt.value = a; opt.innerText = a;
            selArea.appendChild(opt);
        });
      }

      container.innerHTML = `
        <div class="grid-stats">
          <div class="card"><div class="stat-val">${d.dotacion}</div><div class="stat-label">Dotación</div></div>
          <div class="card"><div class="stat-val">${d.cobertura}%</div><div class="stat-label">Cobertura</div></div>
        </div>
        <div class="card">
          <div class="stat-label" style="margin-bottom:15px;">Matriz de Talento (Nine Box)</div>
          ${renderNineBox(d.nineBox)}
        </div>
      `;
    }

    function renderNineBox(data) {
      const labels = [
        {id:"1.1", n:"Bajo"}, {id:"2.1", n:"Medio"}, {id:"3.1", n:"Alto"},
        {id:"1.2", n:"Medio"}, {id:"2.2", n:"Estrella"}, {id:"3.2", n:"Alto"},
        {id:"1.3", n:"Bajo"}, {id:"2.3", n:"Bajo"}, {id:"3.3", n:"Medio"}
      ];

      const cellsHTML = labels.map(l => `
        <div class="nb-cell">
          <div class="nb-cell-label">${l.n}</div>
          <div class="nb-cell-val">${data[l.id] || 0}</div>
        </div>
      `).join('');

      return `
        <div class="nb-wrapper">
          <div class="nb-axis-y-container">
            <div class="nb-y-title">POTENCIAL</div>
            <div class="nb-y-labels"><span>Alto</span><span>Medio</span><span>Bajo</span></div>
          </div>
          <div class="nb-grid-main">
            <div class="nb-grid">${cellsHTML}</div>
            <div class="nb-x-labels"><span>Bajo</span><span>Medio</span><span>Alto</span></div>
            <div class="nb-x-title">PERFORMANCE</div>
          </div>
        </div>`;
    }

    function renderEquipo() {
      const container = document.getElementById('equipo-content');
      const tableRows = dashboardData.colaboradores.map(c => `
        <tr>
          <td><div style="font-weight:700;">${c.nombre}</div><div style="font-size:10px; color:var(--subtle)">${c.cargo}</div></td>
          <td style="text-align:center;"><span class="tl-tag ${c.checkin_mes ? 'tt-f' : ''}">${c.checkin_mes ? 'SÍ' : 'NO'}</span></td>
          <td style="text-align:right;"><button class="btn-ver" onclick="verDetalle('${c.rut}')">VER</button></td>
        </tr>
      `).join('');

      container.innerHTML = `
        <div class="card" style="padding:0;">
          <table>
            <thead><tr><th>COLABORADOR</th><th style="text-align:center;">MES</th><th style="text-align:right;">DETALLE</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      `;
    }

    function verDetalle(rut) {
      const c = dashboardData.colaboradores.find(x => x.rut === rut);
      if(!c) return;
      
      document.getElementById('detalle-nombre').innerText = c.nombre.toUpperCase();
      const mesesAnio = MESES_ORDEN.map(m => `${m} 2026`);
      
      const timelineHTML = mesesAnio.map(m => {
        const realizado = c.meses_checkin && c.meses_checkin.includes(m);
        return `
          <div class="timeline-item" style="opacity: ${realizado ? '1' : '0.4'}">
            <div class="tl-left">
              <div class="tl-dot" style="background:${realizado ? 'var(--red)' : 'var(--border)'}"></div>
              <div class="tl-line"></div>
            </div>
            <div class="tl-content">
              <div class="tl-mes">${m}</div>
              <div class="tl-tag ${realizado ? 'tt-f' : ''}">${realizado ? 'Check-in realizado' : 'Pendiente'}</div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('detail-content').innerHTML = `
        <div class="card">
          <div class="stat-label">Estado de Check-ins</div>
          <div class="timeline">${timelineHTML}</div>
        </div>
      `;
      
      showView('view-detalle');
    }

    // NAVEGACIÓN
    function showTab(tab) {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      event.currentTarget.classList.add('active');
      if(tab === 'global') { showView('view-global'); cargarGlobal(mesGlobalActivo); }
      else { showView('view-equipo'); cargarEquipo(); }
    }

    function showView(viewId) {
      ['view-global', 'view-equipo', 'view-detalle'].forEach(v => {
        document.getElementById(v).style.display = (v === viewId) ? 'block' : 'none';
      });
    }

    function irAEquipo() { showView('view-equipo'); }
    function cambiarArea(area) { areaActiva = area; renderGlobal(); }

    // Carga inicial
    window.onload = () => cargarGlobal();

  </script>
</body>
</html>
